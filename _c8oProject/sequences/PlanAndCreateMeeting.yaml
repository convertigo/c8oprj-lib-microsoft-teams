↓ExecutePlanAndCreateMeeting [steps.SimpleStep-1772536001002]: 
  comment: Suggests/selects a slot then creates the Teams meeting event and optional metadata extension.
  expression: |
    'include("js/graph_meetings.js");
    
    var graphOperation = "plan_and_create_event";
    var requiredPermission = "Calendars.ReadWrite|freeBusy";
    var tokenMode = "delegated_or_application";
    response = null;
    
    try {
    	var organizer = gm_require("organizerUserId", organizerUserId);
    	var meetingSubject = gm_require("subject", subject);
    	var meetingTimeZone = gm_defaultString(timeZone, "Europe/Paris");
    	var attendees = gm_parseAttendees(attendeesJson);
    	var durationMinutes = gm_parseInteger("meetingDurationMinutes", meetingDurationMinutes, 30);
    	if (durationMinutes < 5) {
    		durationMinutes = 5;
    	}
    	
    	var tokenInfo = gm_resolveToken(accessToken, tenantId, clientId, clientSecret);
    	tokenMode = tokenInfo.mode;
    	var graphClient = gm_newGraphClientWithBearer(tokenInfo.token);
    	
    	var selectedStart = "";
    	var selectedEnd = "";
    	var planning = {
    		slotSource: "",
    		strategyRequested: gm_defaultString(strategy, "auto").toLowerCase(),
    		strategyUsed: "",
    		candidateIndex: -1,
    		candidates: []
    	};
    	
    	if (!gm_isBlank(preferredStartIso) || !gm_isBlank(preferredEndIso)) {
    		selectedStart = gm_require("preferredStartIso", preferredStartIso);
    		selectedEnd = gm_require("preferredEndIso", preferredEndIso);
    		planning.slotSource = "preferred";
    		planning.strategyUsed = "preferred";
    	} else {
    		var searchStart = gm_require("searchWindowStartIso", searchWindowStartIso);
    		var searchEnd = gm_require("searchWindowEndIso", searchWindowEndIso);
    		var requestedStrategy = planning.strategyRequested;
    		if (requestedStrategy === "auto") {
    			requestedStrategy = tokenInfo.mode === "delegated" ? "findmeetingtimes" : "getschedule";
    		}
    		if (requestedStrategy !== "findmeetingtimes" && requestedStrategy !== "getschedule") {
    			requestedStrategy = "findmeetingtimes";
    		}
    		if (requestedStrategy === "findmeetingtimes" && tokenInfo.mode === "application") {
    			requestedStrategy = "getschedule";
    		}
    		planning.strategyUsed = requestedStrategy;
    		
    		if (requestedStrategy === "findmeetingtimes") {
    			var maxCandidateCount = gm_parseInteger("maxCandidates", maxCandidates, 5);
    			if (maxCandidateCount < 1) {
    				maxCandidateCount = 1;
    			}
    			var minimumPercent = gm_parseDouble("minimumAttendeePercentage", minimumAttendeePercentage, 50);
    			if (minimumPercent < 0) {
    				minimumPercent = 0;
    			}
    			if (minimumPercent > 100) {
    				minimumPercent = 100;
    			}
    			
        			var findBody = gm_newGraphObject("com.microsoft.graph.users.item.findmeetingtimes.FindMeetingTimesPostRequestBody");
    			findBody.setAttendees(attendees);
    			findBody.setMaxCandidates(new java.lang.Integer(String(maxCandidateCount)));
    			findBody.setMinimumAttendeePercentage(new java.lang.Double(String(minimumPercent)));
    			findBody.setMeetingDuration(Packages.com.microsoft.kiota.PeriodAndDuration.parse("PT" + durationMinutes + "M"));
    			findBody.setReturnSuggestionReasons(java.lang.Boolean.TRUE);
    			
        			var constraint = gm_newGraphObject("com.microsoft.graph.models.TimeConstraint");
        			constraint.setActivityDomain(gm_enumForValue("com.microsoft.graph.models.ActivityDomain", "work", "work"));
    			var slots = new java.util.ArrayList();
        			var slot = gm_newGraphObject("com.microsoft.graph.models.TimeSlot");
    			slot.setStart(gm_newDateTimeTimeZone(searchStart, meetingTimeZone));
    			slot.setEnd(gm_newDateTimeTimeZone(searchEnd, meetingTimeZone));
    			slots.add(slot);
    			constraint.setTimeSlots(slots);
    			findBody.setTimeConstraint(constraint);
    			
    			var suggestionsResult = graphClient.users().byUserId(organizer).findMeetingTimes().post(findBody);
    			var suggestions = suggestionsResult.getMeetingTimeSuggestions();
    			if (suggestions !== null) {
    				var si;
    				for (si = 0; si < suggestions.size(); si++) {
    					var suggestion = suggestions.get(si);
    					var meetingSlot = suggestion.getMeetingTimeSlot();
    					planning.candidates.push({
    						order: suggestion.getOrder(),
    						confidence: suggestion.getConfidence(),
    						reason: gm_safeString(suggestion.getSuggestionReason()),
    						start: meetingSlot === null ? null : gm_dttzToObject(meetingSlot.getStart()),
    						end: meetingSlot === null ? null : gm_dttzToObject(meetingSlot.getEnd())
    					});
    				}
    			}
    			
    			if (planning.candidates.length > 0) {
    				var requestedIndex = gm_parseInteger("selectCandidateIndex", selectCandidateIndex, 0);
    				if (requestedIndex < 0) {
    					requestedIndex = 0;
    				}
    				if (requestedIndex >= planning.candidates.length) {
    					requestedIndex = planning.candidates.length - 1;
    				}
    				planning.candidateIndex = requestedIndex;
    				selectedStart = planning.candidates[requestedIndex].start === null ? "" : gm_safeString(planning.candidates[requestedIndex].start.dateTime);
    				selectedEnd = planning.candidates[requestedIndex].end === null ? "" : gm_safeString(planning.candidates[requestedIndex].end.dateTime);
    				planning.slotSource = "findMeetingTimes";
    			}
    		}
    		
    		if (gm_isBlank(selectedStart) || gm_isBlank(selectedEnd)) {
    			var slotStep = gm_parseInteger("slotStepMinutes", slotStepMinutes, 15);
        			var scheduleBody = gm_newGraphObject("com.microsoft.graph.users.item.calendar.getschedule.GetSchedulePostRequestBody");
    			scheduleBody.setSchedules(gm_getScheduleEmails(organizer, attendeesJson));
    			scheduleBody.setStartTime(gm_newDateTimeTimeZone(searchStart, meetingTimeZone));
    			scheduleBody.setEndTime(gm_newDateTimeTimeZone(searchEnd, meetingTimeZone));
    			scheduleBody.setAvailabilityViewInterval(new java.lang.Integer(String(durationMinutes > 60 ? 60 : durationMinutes)));
    			
    			var scheduleResponse = graphClient.users().byUserId(organizer).calendar().getSchedule().post(scheduleBody);
    			var scheduleValues = scheduleResponse.getValue();
    			planning.strategyUsed = planning.strategyUsed === "findmeetingtimes" ? "findMeetingTimes_then_getSchedule" : "getSchedule";
    			planning.schedulesCount = scheduleValues === null ? 0 : scheduleValues.size();
    			
    			var slotFromSchedule = gm_findFirstAvailableSlot(scheduleValues, searchStart, searchEnd, meetingTimeZone, durationMinutes, slotStep);
    			if (slotFromSchedule !== null) {
    				selectedStart = slotFromSchedule.startIso;
    				selectedEnd = slotFromSchedule.endIso;
    				planning.slotSource = "getSchedule";
    			} else {
    				if (gm_toBoolean(strictSlotSelection, true)) {
    					throw new java.lang.RuntimeException("No available meeting slot found in requested search window");
    				}
    				var fallbackStartMs = gm_parseIsoToEpochMillis(searchStart, meetingTimeZone);
    				var fallbackEndMs = fallbackStartMs + (durationMinutes * 60 * 1000);
    				if (fallbackEndMs > gm_parseIsoToEpochMillis(searchEnd, meetingTimeZone)) {
    					throw new java.lang.RuntimeException("Search window is shorter than requested meeting duration");
    				}
    				selectedStart = gm_epochMillisToIsoLocal(fallbackStartMs, meetingTimeZone);
    				selectedEnd = gm_epochMillisToIsoLocal(fallbackEndMs, meetingTimeZone);
    				planning.slotSource = "window_start_fallback";
    				planning.warning = "No free slot detected, first window slot was selected because strictSlotSelection=false";
    			}
    		}
    	}
    	
        	var event = gm_newGraphObject("com.microsoft.graph.models.Event");
    	event.setSubject(meetingSubject);
    	event.setStart(gm_newDateTimeTimeZone(selectedStart, meetingTimeZone));
    	event.setEnd(gm_newDateTimeTimeZone(selectedEnd, meetingTimeZone));
    	event.setAttendees(attendees);
    	event.setIsOnlineMeeting(java.lang.Boolean.valueOf(String(gm_toBoolean(isOnlineMeeting, true))));
    	
        	var provider = gm_enumForValue("com.microsoft.graph.models.OnlineMeetingProviderType", onlineMeetingProvider, "teamsForBusiness");
    	if (provider !== null) {
    		event.setOnlineMeetingProvider(provider);
    	}
    	
    	if (!gm_isBlank(bodyHtml)) {
    		event.setBody(gm_newBodyHtml(bodyHtml));
    	}
    	
    	if (!gm_isBlank(idempotencyKey)) {
    		event.setTransactionId(String(idempotencyKey));
    	}
    	
    	var created = graphClient.users().byUserId(organizer).events().post(event);
    	var data = {
    		planning: planning,
    		selectedSlot: {
    			startIso: selectedStart,
    			endIso: selectedEnd,
    			timeZone: meetingTimeZone
    		},
    		createdEvent: {
    			eventId: gm_safeString(created.getId()),
    			iCalUId: gm_safeString(created.getICalUId()),
    			webLink: gm_safeString(created.getWebLink()),
    			onlineMeetingUrl: gm_safeString(created.getOnlineMeetingUrl()),
    			start: gm_dttzToObject(created.getStart()),
    			end: gm_dttzToObject(created.getEnd())
    		}
    	};
    	
    	if (!gm_isBlank(customMetadataJson)) {
    		var extensionName = gm_defaultString(metadataExtensionId, "com.convertigo.meeting");
    		data.createdEvent.metadata = gm_upsertOpenExtension(graphClient, organizer, data.createdEvent.eventId, extensionName, customMetadataJson, "merge");
    	}
    	
    	response = gm_responseOk(graphOperation, tokenMode, requiredPermission, data);
    } catch (e) {
    	response = gm_responseError(graphOperation, tokenMode, requiredPermission, e);
    }'

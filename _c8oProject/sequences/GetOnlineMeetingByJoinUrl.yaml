comment: Retrieves an online meeting by its Teams joinWebUrl. (Graph permissions OnlineMeetings.Read|OnlineMeetings.ReadWrite)
↓inputVars [steps.InputVariablesStep-1772640077037]: 
  comment: Exposes request inputs in XML for debugging and source mapping.
↓ExecuteGetOnlineMeetingByJoinUrl [steps.SimpleStep-1772640077070]: 
  comment: Calls Microsoft Graph onlineMeetings endpoint with OData filter on JoinWebUrl.
  expression: |
    'include("js/graph_meetings.js");
    
    var graphOperation = "get_online_meeting_by_join_url";
    var requiredPermission = "OnlineMeetings.Read|OnlineMeetings.ReadWrite";
    var tokenMode = "delegated_or_application";
    response = null;
    
    try {
    	var targetUser = gm_require("userId", userId);
    	var joinUrl = gm_require("joinWebUrl", joinWebUrl);
    	var filterValue = "JoinWebUrl eq ''" + gm_odataEscapeString(joinUrl) + "''";
    	
    	var tokenInfo = gm_resolveToken(accessToken, tenantId, clientId, clientSecret);
    	tokenMode = tokenInfo.mode;
    	var result = gm_graphHttp(
    		"GET",
    		tokenInfo.token,
    		"/users/" + gm_urlEncode(targetUser) + "/onlineMeetings",
    		{
    			"$filter": filterValue,
    			"$top": "1"
    		},
    		null,
    		null
    	);
    	
    	var items = gm_graphPayloadArray(result);
    	if (items.length === 0) {
    		throw new java.lang.RuntimeException("No online meeting found for provided joinWebUrl");
    	}
    	
    	response = gm_responseOk(graphOperation, tokenMode, requiredPermission, {
    		userId: targetUser,
    		joinWebUrl: joinUrl,
    		onlineMeeting: items[0]
    	});
    } catch (e) {
    	response = gm_responseError(graphOperation, tokenMode, requiredPermission, e);
    }'

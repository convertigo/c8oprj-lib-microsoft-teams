↓ExecuteSendChannelMessage [steps.SimpleStep-1772640084389]: 
  comment: Calls Microsoft Graph channel messages endpoint to post a new message.
  expression: |
    'include("js/graph_meetings.js");
    
    var graphOperation = "send_channel_message";
    var requiredPermission = "ChannelMessage.Send|ChannelMessage.ReadWrite";
    var tokenMode = "delegated_or_application";
    response = null;
    
    try {
    	var targetTeamId = gm_require("teamId", teamId);
    	var targetChannelId = gm_require("channelId", channelId);
    	var messageContent = gm_require("message", message);
    	var contentTypeValue = gm_defaultString(contentType, "html");
    	
    	var payload = {
    		body: {
    			contentType: contentTypeValue,
    			content: String(messageContent)
    		}
    	};
    	if (!gm_isBlank(subject)) {
    		payload.subject = String(subject);
    	}
    	if (!gm_isBlank(importance)) {
    		payload.importance = String(importance);
    	}
    	
    	var tokenInfo = gm_resolveToken(accessToken, tenantId, clientId, clientSecret);
    	tokenMode = tokenInfo.mode;
    	var posted = gm_graphHttp(
    		"POST",
    		tokenInfo.token,
    		"/teams/" + gm_urlEncode(targetTeamId) + "/channels/" + gm_urlEncode(targetChannelId) + "/messages",
    		null,
    		payload,
    		null
    	);
    	var data = posted.data === null || posted.data === undefined ? {} : posted.data;
    	
    	response = gm_responseOk(graphOperation, tokenMode, requiredPermission, {
    		teamId: targetTeamId,
    		channelId: targetChannelId,
    		messageId: gm_safeString(data.id),
    		createdDateTime: gm_safeString(data.createdDateTime),
    		webUrl: gm_safeString(data.webUrl),
    		raw: data
    	});
    } catch (e) {
    	response = gm_responseError(graphOperation, tokenMode, requiredPermission, e);
    }'

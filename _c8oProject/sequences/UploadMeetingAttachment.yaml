↓ExecuteUploadMeetingAttachment [steps.SimpleStep-1772640091415]: 
  comment: Calls Microsoft Graph Drive simple upload endpoint using base64 content.
  expression: |
    'include("js/graph_meetings.js");
    
    var graphOperation = "upload_meeting_attachment";
    var requiredPermission = "Files.ReadWrite.All";
    var tokenMode = "delegated_or_application";
    response = null;
    
    try {
    	var targetUser = gm_require("userId", userId);
    	var targetFileName = gm_require("fileName", fileName);
    	var parent = gm_defaultString(parentPath, "/");
    	if (parent.charAt(0) !== "/") {
    		parent = "/" + parent;
    	}
    	while (parent.length > 1 && parent.charAt(parent.length - 1) === "/") {
    		parent = parent.substring(0, parent.length - 1);
    	}
    	var fullPath = (parent === "/" ? "" : parent) + "/" + targetFileName;
    	var endpoint = "/users/" + gm_urlEncode(targetUser) + "/drive/root:" + fullPath + ":/content";
    	var bytes = gm_base64ToBytes(fileContentBase64);
    	
    	var tokenInfo = gm_resolveToken(accessToken, tenantId, clientId, clientSecret);
    	tokenMode = tokenInfo.mode;
    	var uploaded = gm_graphUploadBytes(tokenInfo.token, endpoint, null, bytes, gm_defaultString(contentType, "application/octet-stream"), null);
    	var item = uploaded.data === null || uploaded.data === undefined ? {} : uploaded.data;
    	
    	response = gm_responseOk(graphOperation, tokenMode, requiredPermission, {
    		userId: targetUser,
    		fileName: targetFileName,
    		driveItemId: gm_safeString(item.id),
    		webUrl: gm_safeString(item.webUrl),
    		size: item.size,
    		eTag: gm_safeString(item.eTag),
    		raw: item
    	});
    } catch (e) {
    	response = gm_responseError(graphOperation, tokenMode, requiredPermission, e);
    }'

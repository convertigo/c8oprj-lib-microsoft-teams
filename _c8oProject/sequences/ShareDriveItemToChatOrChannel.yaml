  comment: Exposes request inputs in XML for debugging and source mapping.
↓ExecuteShareDriveItemToChatOrChannel [steps.SimpleStep-1772640087842]: 
  comment: Calls Microsoft Graph chat/channel messages endpoint with an HTML link payload.
  expression: |
    'include("js/graph_meetings.js");
    
    var graphOperation = "share_drive_item";
    var requiredPermission = "ChatMessage.Send|ChannelMessage.Send";
    var tokenMode = "delegated_or_application";
    response = null;
    
    try {
    	var targetType = gm_defaultString(targetType, "chat").toLowerCase();
    	var linkUrl = gm_require("driveItemWebUrl", driveItemWebUrl);
    	var defaultMessage = gm_isBlank(message) ? "Shared document" : String(message);
    	var htmlContent = defaultMessage + "<br/><a href=\"" + linkUrl + "\">" + linkUrl + "</a>";
    	var payload = {
    		body: {
    			contentType: "html",
    			content: htmlContent
    		}
    	};
    	
    	var targetPath = "";
    	var resultContext = {
    		targetType: targetType,
    		driveItemWebUrl: linkUrl
    	};
    	if (targetType === "channel") {
    		var targetTeamId = gm_require("teamId", teamId);
    		var targetChannelId = gm_require("channelId", channelId);
    		targetPath = "/teams/" + gm_urlEncode(targetTeamId) + "/channels/" + gm_urlEncode(targetChannelId) + "/messages";
    		resultContext.teamId = targetTeamId;
    		resultContext.channelId = targetChannelId;
    	} else if (targetType === "chat") {
    		var targetChatId = gm_require("chatId", chatId);
    		targetPath = "/chats/" + gm_urlEncode(targetChatId) + "/messages";
    		resultContext.chatId = targetChatId;
    	} else {
    		throw new java.lang.IllegalArgumentException("targetType must be chat or channel");
    	}
    	
    	var tokenInfo = gm_resolveToken(accessToken, tenantId, clientId, clientSecret);
    	tokenMode = tokenInfo.mode;
    	var sent = gm_graphHttp("POST", tokenInfo.token, targetPath, null, payload, null);
    	var data = sent.data === null || sent.data === undefined ? {} : sent.data;
    	
    	resultContext.messageId = gm_safeString(data.id);
    	resultContext.createdDateTime = gm_safeString(data.createdDateTime);
    	resultContext.webUrl = gm_safeString(data.webUrl);
    	resultContext.raw = data;
    	response = gm_responseOk(graphOperation, tokenMode, requiredPermission, resultContext);
    } catch (e) {
    	response = gm_responseError(graphOperation, tokenMode, requiredPermission, e);
    }'

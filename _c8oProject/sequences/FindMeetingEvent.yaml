    			iCalUId: lookupIcal,
    			transactionId: lookupTransaction,
    			metadataExtensionId: extensionName,
    			metadataKey: metadataKeyValue,
    			metadataValue: metadataExpectedValue,
    			includeMetadataExtension: shouldIncludeMetadata,
    			windowStartIso: hasWindow ? windowStart : "",
    			windowEndIso: hasWindow ? windowEnd : "",
    			maxResults: maxCount
    		},
    		items: results
    	});

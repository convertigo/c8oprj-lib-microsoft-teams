    response = null;
    
    try {
    	var organizer = gm_require("organizerUserId", organizerUserId);
    	var explicitEventId = gm_safeString(eventId);
    	var lookupIcal = gm_safeString(iCalUId);
    	var lookupTransaction = gm_safeString(transactionId);
    	var metadataKeyValue = gm_safeString(metadataKey);
    	var metadataExpectedValue = gm_safeString(metadataValue);
    	var shouldCheckMetadata = !gm_isBlank(metadataKeyValue) || !gm_isBlank(metadataExpectedValue);
    	var shouldIncludeMetadata = gm_toBoolean(includeMetadataExtension, false) || shouldCheckMetadata;
    	
    	if (gm_isBlank(explicitEventId) && gm_isBlank(lookupIcal) && gm_isBlank(lookupTransaction) && !shouldCheckMetadata) {
    		throw new java.lang.IllegalArgumentException("Provide eventId, iCalUId, transactionId or metadataKey/metadataValue");
    	}
    	
    	var maxCount = gm_parseInteger("maxResults", maxResults, 20);
    	if (maxCount < 1) {
    		maxCount = 1;
    	}
    	if (maxCount > 200) {
    		maxCount = 200;
    	}
    	
    	var shouldIncludeAttendees = gm_toBoolean(includeAttendees, false);
    	var shouldIncludeBody = gm_toBoolean(includeBody, false);
    	var extensionName = gm_defaultString(metadataExtensionId, "com.convertigo.meeting");
    	
    	var windowStart = gm_safeString(windowStartIso);
    	var windowEnd = gm_safeString(windowEndIso);
    	var hasWindow = !gm_isBlank(windowStart) || !gm_isBlank(windowEnd);
    	if (hasWindow) {
    		windowStart = gm_require("windowStartIso", windowStartIso);
    		windowEnd = gm_require("windowEndIso", windowEndIso);
    	}
    	
    	if (shouldCheckMetadata && gm_isBlank(explicitEventId) && gm_isBlank(lookupIcal) && gm_isBlank(lookupTransaction) && !hasWindow) {
    		throw new java.lang.IllegalArgumentException("windowStartIso and windowEndIso are required for metadata-only search");
    	}
    	
    	var tokenInfo = gm_resolveToken(accessToken, tenantId, clientId, clientSecret);
    	tokenMode = tokenInfo.mode;
    	var graphClient = gm_newGraphClientWithBearer(tokenInfo.token);
    	
    	var metadataMatches = function(metadataExtensionObject) {
    		if (!shouldCheckMetadata) {
    			return true;
    		}
    		if (metadataExtensionObject === null || metadataExtensionObject === undefined) {
    			return false;
    		}
    		var additionalData = metadataExtensionObject.additionalData;
    		if (additionalData === null || additionalData === undefined) {
    			return false;
    		}
    		if (!gm_isBlank(metadataKeyValue)) {
    			if (!Object.prototype.hasOwnProperty.call(additionalData, metadataKeyValue)) {
    				return false;
    			}
    			if (gm_isBlank(metadataExpectedValue)) {
    				return true;
    			}
    			return String(additionalData[metadataKeyValue]) === String(metadataExpectedValue);
    		}
    		if (gm_isBlank(metadataExpectedValue)) {
    			return true;
    		}
    		var key;
    		for (key in additionalData) {
    			if (Object.prototype.hasOwnProperty.call(additionalData, key) && String(additionalData[key]) === String(metadataExpectedValue)) {
    				return true;
    			}
    		}
    		return false;

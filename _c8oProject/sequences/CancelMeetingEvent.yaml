↓ExecuteCancelMeeting [steps.SimpleStep-1772535586950]: 
  comment: Calls Microsoft Graph Java SDK to cancel or hard-delete an event.
  expression: |
    'include("js/graph_meetings.js");
    
    var graphOperation = "cancel_event";
    var requiredPermission = "Calendars.ReadWrite";
    var tokenMode = "delegated_or_application";
    response = null;
    
    try {
    	var organizer = gm_require("organizerUserId", organizerUserId);
    	var targetEventId = gm_require("eventId", eventId);
    	var shouldSendCancellation = gm_toBoolean(sendCancellation, true);
    	
    	var tokenInfo = gm_resolveToken(accessToken, tenantId, clientId, clientSecret);
    	tokenMode = tokenInfo.mode;
    	var graphClient = gm_newGraphClientWithBearer(tokenInfo.token);
    	
    	var data = {
    		eventId: targetEventId,
    		action: ""
    	};
    	
    	if (shouldSendCancellation) {
    		var cancelBody = new Packages.com.microsoft.graph.users.item.events.item.cancel.CancelPostRequestBody();
    		cancelBody.setComment(gm_defaultString(cancelComment, "Cancelled from Convertigo."));
    		graphClient.users().byUserId(organizer).events().byEventId(targetEventId).cancel().post(cancelBody);
    		data.action = "cancel";
    	} else {
    		graphClient.users().byUserId(organizer).events().byEventId(targetEventId).delete();
    		data.action = "delete";
    	}
    	
    	data.sendCancellation = shouldSendCancellation;
    	response = gm_responseOk(graphOperation, tokenMode, requiredPermission, data);
    } catch (e) {
    	response = gm_responseError(graphOperation, tokenMode, requiredPermission, e);
    }'

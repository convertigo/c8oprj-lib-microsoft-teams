  comment: Calls Microsoft Graph Java SDK to cancel or hard-delete an event.
  expression: |
    'include("js/graph_meetings.js");
    
    var graphOperation = "cancel_event";
    var requiredPermission = "Calendars.ReadWrite";
    var tokenMode = "delegated_or_application";
    response = null;
    
    try {
    	var organizer = gm_require("organizerUserId", organizerUserId);
    	var targetEventId = gm_require("eventId", eventId);
    	var shouldSendCancellation = gm_toBoolean(sendCancellation, true);
    	var requestedProvider = gm_normalizeProvider(provider, "graph");
    	var ewsConfigured = gm_ewsHasCredentials(ewsUrl, ewsUsername, ewsPassword);
    	var data = null;
    	
    	var runGraph = function() {
    		var tokenInfo = gm_resolveToken(accessToken, tenantId, clientId, clientSecret);
    		var graphClient = gm_newGraphClientWithBearer(tokenInfo.token);
    		var graphData = {
    			eventId: targetEventId,
    			action: "",
    			providerUsed: "graph"
    		};
    		
    		if (shouldSendCancellation) {
    			var cancelBody = new Packages.com.microsoft.graph.users.item.events.item.cancel.CancelPostRequestBody();
    			cancelBody.setComment(gm_defaultString(cancelComment, "Cancelled from Convertigo."));
    			graphClient.users().byUserId(organizer).events().byEventId(targetEventId).cancel().post(cancelBody);
    			graphData.action = "cancel";
    			graphData.cancelCommentApplied = !gm_isBlank(cancelComment);
    		} else {
    			graphClient.users().byUserId(organizer).events().byEventId(targetEventId).delete();
    			graphData.action = "delete";
    		}
    		
    		graphData.sendCancellation = shouldSendCancellation;
    		return {
    			tokenMode: tokenInfo.mode,
    			data: graphData
    		};
    	};
    	
    	var runEws = function() {
    		var ewsContext = gm_ewsBuildContext(organizer, ewsUrl, ewsUsername, ewsPassword, ewsImpersonateUserId);
    		var ewsData = gm_ewsDeleteEvent(ewsContext, targetEventId, shouldSendCancellation);
    		ewsData.providerUsed = "ews";
    		if (!gm_isBlank(cancelComment) && shouldSendCancellation) {
    			ewsData.cancelCommentApplied = false;
    			ewsData.cancelCommentNote = "EWS DeleteItem does not support custom cancellation comments";
    		}
    		return {
    			tokenMode: "ews",
    			data: ewsData
    		};
    	};
    	
    	if (requestedProvider === "ews") {
    		var ewsResult = runEws();
    		tokenMode = ewsResult.tokenMode;
    		data = ewsResult.data;
    	} else {
    		try {
    			var graphResult = runGraph();
    			tokenMode = graphResult.tokenMode;
    			data = graphResult.data;
    		} catch (graphError) {
    			if (requestedProvider === "auto" && ewsConfigured && gm_ewsShouldFallback(graphError)) {
    				var fallbackResult = runEws();
    				tokenMode = "ews_fallback";
    				data = fallbackResult.data;
    				data.graphFallbackReason = gm_safeString(graphError.message);
    			} else {
    				throw graphError;
    			}
    		}
    	}
    	
    	data.providerRequested = requestedProvider;
    	response = gm_responseOk(graphOperation, tokenMode, requiredPermission, data);
    } catch (e) {
    	response = gm_responseError(graphOperation, tokenMode, requiredPermission, e);
    }'

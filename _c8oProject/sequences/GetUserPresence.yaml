comment: Retrieves real-time Teams presence for a user. (Graph permissions Presence.Read.All)
↓inputVars [steps.InputVariablesStep-1772640078236]: 
  comment: Exposes request inputs in XML for debugging and source mapping.
↓ExecuteGetUserPresence [steps.SimpleStep-1772640078274]: 
  comment: Calls Microsoft Graph presence endpoint for one user.
  expression: |
    'include("js/graph_meetings.js");
    
    var graphOperation = "get_user_presence";
    var requiredPermission = "Presence.Read.All";
    var tokenMode = "delegated_or_application";
    response = null;
    
    try {
    	var targetUser = gm_require("userId", userId);
    	var tokenInfo = gm_resolveToken(accessToken, tenantId, clientId, clientSecret);
    	tokenMode = tokenInfo.mode;
    	var presence = gm_graphHttp("GET", tokenInfo.token, "/users/" + gm_urlEncode(targetUser) + "/presence", null, null, null);
    	
    	response = gm_responseOk(graphOperation, tokenMode, requiredPermission, {
    		userId: targetUser,
    		presence: presence.data
    	});
    } catch (e) {
    	response = gm_responseError(graphOperation, tokenMode, requiredPermission, e);
    }'

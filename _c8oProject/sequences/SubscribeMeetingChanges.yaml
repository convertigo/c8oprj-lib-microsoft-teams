↓ExecuteSubscribeMeetingChanges [steps.SimpleStep-1772553005002]: 
  comment: Calls Microsoft Graph subscriptions endpoint to create an event change subscription.
  expression: |
    'include("js/graph_meetings.js");
    
    var graphOperation = "subscribe_event_changes";
    var requiredPermission = "Subscriptions.ReadWrite.All";
    var tokenMode = "delegated_or_application";
    response = null;
    
    try {
    	var organizer = gm_require("organizerUserId", organizerUserId);
    	var callbackUrl = gm_require("notificationUrl", notificationUrl);
    	var expiration = gm_require("expirationDateTimeIso", expirationDateTimeIso);
    	var includeResourcePayload = gm_toBoolean(includeResourceData, false);
    	
    	var tokenInfo = gm_resolveToken(accessToken, tenantId, clientId, clientSecret);
    	tokenMode = tokenInfo.mode;
    	var graphClient = gm_newGraphClientWithBearer(tokenInfo.token);
    	
    	var subscription = gm_newGraphObject("com.microsoft.graph.models.Subscription");
    	var resourcePath = gm_defaultString(resource, "users/" + organizer + "/events");
    	subscription.setResource(resourcePath);
    	subscription.setChangeType(gm_defaultString(changeType, "created,updated,deleted"));
    	subscription.setNotificationUrl(callbackUrl);
    	subscription.setExpirationDateTime(java.time.OffsetDateTime.parse(expiration));
    	
    	if (!gm_isBlank(clientState)) {
    		subscription.setClientState(String(clientState));
    	}
    	if (!gm_isBlank(lifecycleNotificationUrl)) {
    		subscription.setLifecycleNotificationUrl(String(lifecycleNotificationUrl));
    	}
    	if (includeResourcePayload) {
    		subscription.setIncludeResourceData(java.lang.Boolean.TRUE);
    		subscription.setEncryptionCertificate(gm_require("encryptionCertificate", encryptionCertificate));
    		subscription.setEncryptionCertificateId(gm_require("encryptionCertificateId", encryptionCertificateId));
    	}
    	
    	var created = graphClient.subscriptions().post(subscription);
    	response = gm_responseOk(graphOperation, tokenMode, requiredPermission, {
    		subscriptionId: gm_safeString(created.getId()),
    		resource: gm_safeString(created.getResource()),
    		changeType: gm_safeString(created.getChangeType()),
    		notificationUrl: gm_safeString(created.getNotificationUrl()),
    		lifecycleNotificationUrl: gm_safeString(created.getLifecycleNotificationUrl()),
    		clientState: gm_safeString(created.getClientState()),
    		expirationDateTime: gm_offsetDateTimeToString(created.getExpirationDateTime()),
    		includeResourceData: created.getIncludeResourceData()
    	});
    } catch (e) {
    	response = gm_responseError(graphOperation, tokenMode, requiredPermission, e);
    }'

↓ExecuteValidateGraphPermissions [steps.SimpleStep-1772640093019]: 
  comment: Calls a configurable set of Microsoft Graph endpoints and reports authorization status.
  expression: |
    'include("js/graph_meetings.js");
    
    var graphOperation = "validate_graph_permissions";
    var requiredPermission = "Mixed (see checks array)";
    var tokenMode = "delegated_or_application";
    response = null;
    
    try {
    	var targetUser = gm_require("userId", userId);
    	var defaultChecks = [
    		"presence",
    		"chats",
    		"calendar",
    		"onlineMeetings",
    		"joinedTeams",
    		"drive"
    	];
    	
    	var requestedChecks = defaultChecks;
    	if (!gm_isBlank(checksJson)) {
    		requestedChecks = gm_parseJsonArrayInput("checksJson", checksJson, true);
    		if (requestedChecks.length === 0) {
    			requestedChecks = defaultChecks;
    		}
    	}
    	
    	var checkCatalog = {
    		presence: { permission: "Presence.Read.All", method: "GET", path: "/users/" + gm_urlEncode(targetUser) + "/presence", query: null },
    		chats: { permission: "Chat.Read", method: "GET", path: "/users/" + gm_urlEncode(targetUser) + "/chats", query: { "$top": "1" } },
    		calendar: { permission: "Calendars.Read", method: "GET", path: "/users/" + gm_urlEncode(targetUser) + "/events", query: { "$top": "1" } },
    		onlineMeetings: { permission: "OnlineMeetings.Read", method: "GET", path: "/users/" + gm_urlEncode(targetUser) + "/onlineMeetings", query: null },
    		joinedTeams: { permission: "Team.ReadBasic.All", method: "GET", path: "/users/" + gm_urlEncode(targetUser) + "/joinedTeams", query: null },
    		drive: { permission: "Files.Read", method: "GET", path: "/users/" + gm_urlEncode(targetUser) + "/drive/root", query: null }
    	};
    	
    	var tokenInfo = gm_resolveToken(accessToken, tenantId, clientId, clientSecret);
    	tokenMode = tokenInfo.mode;
    	
    	var results = [];
    	var successCount = 0;
    	var failureCount = 0;
    	var i;
    	for (i = 0; i < requestedChecks.length; i++) {
    		var checkName = gm_safeString(requestedChecks[i]);
    		if (gm_isBlank(checkName) || !Object.prototype.hasOwnProperty.call(checkCatalog, checkName)) {
    			results.push({
    				check: checkName,
    				status: "SKIPPED",
    				reason: "unknown_check"
    			});
    			continue;
    		}
    		var checkSpec = checkCatalog[checkName];
    		try {
    			var checkPath = checkSpec.path;
    			if (checkName === "onlineMeetings") {
    				checkPath = "/users/" + gm_urlEncode(gm_graphResolveOnlineMeetingsUserId(tokenInfo, targetUser)) + "/onlineMeetings";
    			}
    			var checkResult = gm_graphHttp(checkSpec.method, tokenInfo.token, checkPath, checkSpec.query, null, null);
    			results.push({
    				check: checkName,
    				status: "OK",
    				requiredPermission: checkSpec.permission,
    				statusCode: checkResult.statusCode
    			});
    			successCount++;
    		} catch (checkError) {
    			results.push({
    				check: checkName,
    				status: "ERROR",
    				requiredPermission: checkSpec.permission,
    				errorClass: gm_errorClass(checkError),
    				errorMessage: gm_safeString(checkError.message)
    			});
    			failureCount++;
    		}
    	}
    	
    	response = gm_responseOk(graphOperation, tokenMode, requiredPermission, {
    		userId: targetUser,
    		checksRequested: requestedChecks,
    		successCount: successCount,
    		failureCount: failureCount,
    		results: results
    	});
    } catch (e) {
    	response = gm_responseError(graphOperation, tokenMode, requiredPermission, e);
    }'

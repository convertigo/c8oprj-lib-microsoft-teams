↓ExecuteListMeetingEvents [steps.SimpleStep-1772553001002]: 
  comment: Calls Microsoft Graph or EWS to list events from events or calendarView endpoints.
  expression: |
    'include("js/graph_meetings.js");
    
    var graphOperation = "list_events";
    var requiredPermission = "Calendars.Read|Calendars.ReadWrite";
    var tokenMode = "delegated_or_application";
    response = null;
    
    try {
    	var organizer = gm_require("organizerUserId", organizerUserId);
    	var shouldIncludeAttendees = gm_toBoolean(includeAttendees, false);
    	var shouldIncludeBody = gm_toBoolean(includeBody, false);
    	var shouldIncludeCancelled = gm_toBoolean(includeCancelled, true);
    	var requestedProvider = gm_normalizeProvider(provider, "graph");
    	var ewsConfigured = gm_ewsHasCredentials(ewsUrl, ewsUsername, ewsPassword);
    	var data = null;
    	
    	var pageTop = gm_parseInteger("top", top, 50);
    	if (pageTop < 1) {
    		pageTop = 1;
    	}
    	if (pageTop > 999) {
    		pageTop = 999;
    	}
    	
    	var pageSkip = gm_parseInteger("skip", skip, 0);
    	if (pageSkip < 0) {
    		pageSkip = 0;
    	}
    	
    	var windowStart = gm_safeString(windowStartIso);
    	var windowEnd = gm_safeString(windowEndIso);
    	var hasWindow = !gm_isBlank(windowStart) || !gm_isBlank(windowEnd);
    	if (hasWindow) {
    		windowStart = gm_require("windowStartIso", windowStartIso);
    		windowEnd = gm_require("windowEndIso", windowEndIso);
    	}
    	
    	var normalizedFilter = gm_safeString(filter);
    	if (!shouldIncludeCancelled) {
    		var cancellationFilter = "isCancelled ne true";
    		if (gm_isBlank(normalizedFilter)) {
    			normalizedFilter = cancellationFilter;
    		} else {
    			normalizedFilter = "(" + normalizedFilter + ") and " + cancellationFilter;
    		}
    	}
    	
    	var runGraph = function() {
    		var tokenInfo = gm_resolveToken(accessToken, tenantId, clientId, clientSecret);
    		var graphClient = gm_newGraphClientWithBearer(tokenInfo.token);
    		
    		var baseUrl = gm_getGraphBaseUrl(graphClient) + "/users/" + gm_urlEncode(organizer) + (hasWindow ? "/calendarView" : "/events");
    		var requestUrl = baseUrl;
    		if (hasWindow) {
    			requestUrl = gm_appendQueryParam(requestUrl, "startDateTime", windowStart);
    			requestUrl = gm_appendQueryParam(requestUrl, "endDateTime", windowEnd);
    		}
    		requestUrl = gm_appendQueryParam(requestUrl, "$top", String(pageTop));
    		if (pageSkip > 0) {
    			requestUrl = gm_appendQueryParam(requestUrl, "$skip", String(pageSkip));
    		}
    		if (!gm_isBlank(orderBy)) {
    			requestUrl = gm_appendQueryParam(requestUrl, "$orderby", String(orderBy));
    		}
    		if (!gm_isBlank(normalizedFilter)) {
    			requestUrl = gm_appendQueryParam(requestUrl, "$filter", normalizedFilter);
    		}
    		
    		var eventsResponse = hasWindow
    			? graphClient.users().byUserId(organizer).calendarView().withUrl(requestUrl).get()
    			: graphClient.users().byUserId(organizer).events().withUrl(requestUrl).get();
    		
    		var items = gm_eventsToArray(eventsResponse.getValue(), shouldIncludeAttendees, shouldIncludeBody);
    		var graphData = {
    			organizerUserId: organizer,
    			viewMode: hasWindow ? "calendarView" : "events",
    			count: items.length,
    			nextLink: gm_getOdataNextLink(eventsResponse),
    			query: {
    				top: pageTop,
    				skip: pageSkip,
    				orderBy: gm_safeString(orderBy),
    				filter: normalizedFilter,
    				windowStartIso: hasWindow ? windowStart : "",
    				windowEndIso: hasWindow ? windowEnd : "",
    				includeAttendees: shouldIncludeAttendees,
    				includeBody: shouldIncludeBody,
    				includeCancelled: shouldIncludeCancelled
    			},
    			items: items,
    			providerUsed: "graph"
    		};
    		return {
    			tokenMode: tokenInfo.mode,
    			data: graphData
    		};
    	};
    	
    	var runEws = function() {
    		var ewsContext = gm_ewsBuildContext(organizer, ewsUrl, ewsUsername, ewsPassword, ewsImpersonateUserId);
    		var ewsData = gm_ewsListEvents(
    			ewsContext,
    			hasWindow ? windowStart : "",
    			hasWindow ? windowEnd : "",
    			pageTop,
    			pageSkip,
    			shouldIncludeAttendees,
    			shouldIncludeBody,
    			shouldIncludeCancelled,
    			orderBy,
    			normalizedFilter
    		);
    		ewsData.providerUsed = "ews";
    		return {
    			tokenMode: "ews",
    			data: ewsData
    		};
    	};
    	
    	if (requestedProvider === "ews") {
    		var ewsResult = runEws();
    		tokenMode = ewsResult.tokenMode;
    		data = ewsResult.data;
    	} else {
    		try {
    			var graphResult = runGraph();
    			tokenMode = graphResult.tokenMode;
    			data = graphResult.data;
    		} catch (graphError) {
    			if (requestedProvider === "auto" && ewsConfigured && gm_ewsShouldFallback(graphError)) {
    				var fallbackResult = runEws();
    				tokenMode = "ews_fallback";
    				data = fallbackResult.data;
    				data.graphFallbackReason = gm_safeString(graphError.message);
    			} else {
    				throw graphError;
    			}
    		}
    	}
    	
    	data.providerRequested = requestedProvider;
    	response = gm_responseOk(graphOperation, tokenMode, requiredPermission, data);
    } catch (e) {
    	response = gm_responseError(graphOperation, tokenMode, requiredPermission, e);
    }'

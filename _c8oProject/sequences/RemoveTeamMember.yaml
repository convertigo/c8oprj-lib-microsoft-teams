comment: Removes a member from a Microsoft Teams team. (Graph permissions TeamMember.ReadWrite.All|Group.ReadWrite.All)
↓inputVars [steps.InputVariablesStep-1772640083205]: 
  comment: Exposes request inputs in XML for debugging and source mapping.
↓ExecuteRemoveTeamMember [steps.SimpleStep-1772640083238]: 
  comment: Calls Microsoft Graph team members endpoint to delete a member.
  expression: |
    'include("js/graph_meetings.js");
    
    var graphOperation = "remove_team_member";
    var requiredPermission = "TeamMember.ReadWrite.All|Group.ReadWrite.All";
    var tokenMode = "delegated_or_application";
    response = null;
    
    try {
    	var targetTeamId = gm_require("teamId", teamId);
    	var targetMemberId = gm_require("memberId", memberId);
    	
    	var tokenInfo = gm_resolveToken(accessToken, tenantId, clientId, clientSecret);
    	tokenMode = tokenInfo.mode;
    	var deleted = gm_graphHttp("DELETE", tokenInfo.token, "/teams/" + gm_urlEncode(targetTeamId) + "/members/" + gm_urlEncode(targetMemberId), null, null, null);
    	
    	response = gm_responseOk(graphOperation, tokenMode, requiredPermission, {
    		teamId: targetTeamId,
    		memberId: targetMemberId,
    		statusCode: deleted.statusCode,
    		action: "deleted"
    	});
    } catch (e) {
    	response = gm_responseError(graphOperation, tokenMode, requiredPermission, e);
    }'

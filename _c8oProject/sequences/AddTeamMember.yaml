↓ExecuteAddTeamMember [steps.SimpleStep-1772640067439]: 
  comment: Calls Microsoft Graph team members endpoint to add a conversation member.
  expression: |
    'include("js/graph_meetings.js");
    
    var graphOperation = "add_team_member";
    var requiredPermission = "TeamMember.ReadWrite.All|Group.ReadWrite.All";
    var tokenMode = "delegated_or_application";
    response = null;
    
    try {
    	var targetTeamId = gm_require("teamId", teamId);
    	var targetUserId = gm_require("userId", userId);
    	var roles = [];
    	if (!gm_isBlank(rolesCsv)) {
    		var chunks = String(rolesCsv).split(",");
    		var i;
    		for (i = 0; i < chunks.length; i++) {
    			var roleValue = String(chunks[i]).trim();
    			if (roleValue.length > 0) {
    				roles.push(roleValue);
    			}
    		}
    	}
    	
    	var payload = {
    		"@odata.type": "#microsoft.graph.aadUserConversationMember",
    		roles: roles,
    		"user@odata.bind": "https://graph.microsoft.com/v1.0/users(''" + gm_odataEscapeString(targetUserId) + "'')"
    	};
    	
    	var tokenInfo = gm_resolveToken(accessToken, tenantId, clientId, clientSecret);
    	tokenMode = tokenInfo.mode;
    	var created = gm_graphHttp("POST", tokenInfo.token, "/teams/" + gm_urlEncode(targetTeamId) + "/members", null, payload, null);
    	var data = created.data === null || created.data === undefined ? {} : created.data;
    	
    	response = gm_responseOk(graphOperation, tokenMode, requiredPermission, {
    		teamId: targetTeamId,
    		memberId: gm_safeString(data.id),
    		userId: targetUserId,
    		roles: roles,
    		raw: data
    	});
    } catch (e) {
    	response = gm_responseError(graphOperation, tokenMode, requiredPermission, e);
    }'

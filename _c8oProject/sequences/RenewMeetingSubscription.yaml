↓ExecuteRenewMeetingSubscription [steps.SimpleStep-1772553006002]: 
  comment: Calls Microsoft Graph subscriptions patch endpoint to renew expiration.
  expression: |
    'include("js/graph_meetings.js");
    
    var graphOperation = "renew_subscription";
    var requiredPermission = "Subscriptions.ReadWrite.All";
    var tokenMode = "delegated_or_application";
    response = null;
    
    try {
    	var subscriptionIdentifier = gm_require("subscriptionId", subscriptionId);
    	var expiration = gm_require("expirationDateTimeIso", expirationDateTimeIso);
    	
    	var tokenInfo = gm_resolveToken(accessToken, tenantId, clientId, clientSecret);
    	tokenMode = tokenInfo.mode;
    	var graphClient = gm_newGraphClientWithBearer(tokenInfo.token);
    	
    	var updateBody = gm_newGraphObject("com.microsoft.graph.models.Subscription");
    	updateBody.setExpirationDateTime(java.time.OffsetDateTime.parse(expiration));
    	var renewed = graphClient.subscriptions().bySubscriptionId(subscriptionIdentifier).patch(updateBody);
    	
    	response = gm_responseOk(graphOperation, tokenMode, requiredPermission, {
    		subscriptionId: gm_safeString(renewed.getId()),
    		resource: gm_safeString(renewed.getResource()),
    		changeType: gm_safeString(renewed.getChangeType()),
    		expirationDateTime: gm_offsetDateTimeToString(renewed.getExpirationDateTime())
    	});
    } catch (e) {
    	response = gm_responseError(graphOperation, tokenMode, requiredPermission, e);
    }'

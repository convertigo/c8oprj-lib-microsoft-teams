  comment: Exposes request inputs in XML for debugging and source mapping.
↓ExecuteCreateTeam [steps.SimpleStep-1772640070924]: 
  comment: Calls Microsoft Graph teams endpoint to create a new team.
  expression: |
    'include("js/graph_meetings.js");
    
    var graphOperation = "create_team";
    var requiredPermission = "Team.Create|Group.ReadWrite.All";
    var tokenMode = "delegated_or_application";
    response = null;
    
    try {
    	var displayNameValue = gm_require("displayName", displayName);
    	var payload = {
    		"template@odata.bind": "https://graph.microsoft.com/v1.0/teamsTemplates(''" + gm_defaultString(templateName, "standard") + "'')",
    		displayName: displayNameValue,
    		description: gm_safeString(description),
    		visibility: gm_defaultString(visibility, "Private")
    	};
    	
    	if (!gm_isBlank(ownerUserIdsJson)) {
    		var owners = gm_parseJsonArrayInput("ownerUserIdsJson", ownerUserIdsJson, true);
    		var members = [];
    		var i;
    		for (i = 0; i < owners.length; i++) {
    			var ownerUserId = owners[i];
    			if (gm_isBlank(ownerUserId)) {
    				continue;
    			}
    			members.push({
    				"@odata.type": "#microsoft.graph.aadUserConversationMember",
    				roles: ["owner"],
    				"user@odata.bind": "https://graph.microsoft.com/v1.0/users(''" + gm_odataEscapeString(ownerUserId) + "'')"
    			});
    		}
    		if (members.length > 0) {
    			payload.members = members;
    		}
    	}
    	
    	var tokenInfo = gm_resolveToken(accessToken, tenantId, clientId, clientSecret);
    	tokenMode = tokenInfo.mode;
    	var created = gm_graphHttp("POST", tokenInfo.token, "/teams", null, payload, null);
    	var locationHeader = gm_safeString(created.headers.Location);
    	if (gm_isBlank(locationHeader)) {
    		locationHeader = gm_safeString(created.headers.location);
    	}
    	
    	response = gm_responseOk(graphOperation, tokenMode, requiredPermission, {
    		statusCode: created.statusCode,
    		operationLocation: locationHeader,
    		team: created.data,
    		requestPayload: payload
    	});
    } catch (e) {
    	response = gm_responseError(graphOperation, tokenMode, requiredPermission, e);
    }'

    'include("js/graph_meetings.js");
    
    var graphOperation = "get_event";
    var requiredPermission = "Calendars.Read|Calendars.ReadWrite";
    var tokenMode = "delegated_or_application";
    response = null;
    
    try {
    	var organizer = gm_require("organizerUserId", organizerUserId);
    	var targetEventId = gm_require("eventId", eventId);
    	var shouldIncludeAttendees = gm_toBoolean(includeAttendees, true);
    	var shouldIncludeBody = gm_toBoolean(includeBody, true);
    	var shouldIncludeExtensions = gm_toBoolean(includeExtensions, true);
    	var shouldFailIfMetadataMissing = gm_toBoolean(failIfMetadataMissing, false);
    	var shouldFailIfExtensionsUnsupported = gm_toBoolean(failIfExtensionsUnsupported, false);
    	
    	var requestedProvider = gm_normalizeProvider(provider, "graph");
    	var ewsConfigured = gm_ewsHasCredentials(ewsUrl, ewsUsername, ewsPassword);
    	var data = null;
    	
    	var runGraph = function() {
    		var tokenInfo = gm_resolveToken(accessToken, tenantId, clientId, clientSecret);
    		var graphClient = gm_newGraphClientWithBearer(tokenInfo.token);
    		var eventBuilder = graphClient.users().byUserId(organizer).events().byEventId(targetEventId);
    		
    		var event = eventBuilder.get();
    		var graphData = {
    			eventId: gm_safeString(event.getId()),
    			iCalUId: gm_safeString(event.getICalUId()),
    			subject: gm_safeString(event.getSubject()),
    			webLink: gm_safeString(event.getWebLink()),
    			isOnlineMeeting: event.getIsOnlineMeeting(),
    			onlineMeetingProvider: gm_enumValue(event.getOnlineMeetingProvider()),
    			onlineMeetingUrl: gm_safeString(event.getOnlineMeetingUrl()),
    			showAs: gm_enumValue(event.getShowAs()),
    			isCancelled: event.getIsCancelled(),
    			start: gm_dttzToObject(event.getStart()),
    			end: gm_dttzToObject(event.getEnd()),
    			organizer: gm_recipientToObject(event.getOrganizer()),
    			location: gm_locationToObject(event.getLocation()),
    			onlineMeeting: gm_onlineMeetingInfoToObject(event.getOnlineMeeting()),
    			providerUsed: "graph"
    		};
    		
    		if (shouldIncludeAttendees) {
    			graphData.attendees = gm_attendeesToArray(event.getAttendees());
    		}
    		
    		if (shouldIncludeBody) {
    			graphData.body = gm_itemBodyToObject(event.getBody());
    		}
    		
    		if (!gm_isBlank(metadataExtensionId)) {
    			try {
    				var metadataExtension = eventBuilder.extensions().byExtensionId(String(metadataExtensionId)).get();
    				graphData.metadataExtension = gm_extensionToObject(metadataExtension);
    			} catch (metadataError) {
    				if (shouldFailIfMetadataMissing) {
    					throw metadataError;
    				}
    				graphData.metadataExtension = null;
    				graphData.metadataExtensionMissing = true;
    			}
    		}
    		
    		if (shouldIncludeExtensions) {
    			try {
    				var extensionsResponse = eventBuilder.extensions().get();
    				var extensionValues = extensionsResponse === null ? null : extensionsResponse.getValue();
    				graphData.extensions = gm_extensionsToArray(extensionValues);
    			} catch (extensionsError) {
    				if (shouldFailIfExtensionsUnsupported) {
    					throw extensionsError;
    				}
    				graphData.extensions = [];
    				graphData.extensionsUnsupported = true;
    				graphData.extensionsUnsupportedError = gm_safeString(extensionsError.message);
    			}
    		}
    		
    		return {
    			tokenMode: tokenInfo.mode,
    			data: graphData
    		};
    	};
    	
    	var runEws = function() {
    		var ewsContext = gm_ewsBuildContext(organizer, ewsUrl, ewsUsername, ewsPassword, ewsImpersonateUserId);
    		var ewsData = gm_ewsCalendarItemToObject(
    			gm_ewsGetCalendarItem(ewsContext, targetEventId),
    			shouldIncludeAttendees,
    			shouldIncludeBody
    		);
    		ewsData.providerUsed = "ews";
    		
    		if (!gm_isBlank(metadataExtensionId)) {
    			if (shouldFailIfMetadataMissing) {
    				throw new java.lang.RuntimeException("metadataExtensionId is not supported in EWS mode");
    			}
    			ewsData.metadataExtension = null;
    			ewsData.metadataExtensionMissing = true;
    			ewsData.metadataExtensionUnsupported = true;
    		}
    		
    		if (shouldIncludeExtensions) {
    			if (shouldFailIfExtensionsUnsupported) {
    				throw new java.lang.RuntimeException("extensions listing is not supported in EWS mode");
    			}
    			ewsData.extensions = [];
    			ewsData.extensionsUnsupported = true;
    			ewsData.extensionsUnsupportedError = "Open extensions are not supported in EWS mode";
    		}
    		
    		return {
    			tokenMode: "ews",
    			data: ewsData
    		};
    	};
    	
    	if (requestedProvider === "ews") {
    		var ewsResult = runEws();
    		tokenMode = ewsResult.tokenMode;
    		data = ewsResult.data;
    	} else {
    		try {
    			var graphResult = runGraph();
    			tokenMode = graphResult.tokenMode;
    			data = graphResult.data;
    		} catch (graphError) {
    			if (requestedProvider === "auto" && ewsConfigured && gm_ewsShouldFallback(graphError)) {
    				var fallbackResult = runEws();
    				tokenMode = "ews_fallback";
    				data = fallbackResult.data;
    				data.graphFallbackReason = gm_safeString(graphError.message);
    			} else {
    				throw graphError;
    			}
    		}
    	}
    	
    	data.providerRequested = requestedProvider;
    	response = gm_responseOk(graphOperation, tokenMode, requiredPermission, data);
    } catch (e) {
    	response = gm_responseError(graphOperation, tokenMode, requiredPermission, e);
    }'

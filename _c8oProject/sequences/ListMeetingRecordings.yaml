comment: Lists recordings for a Teams online meeting. (Graph permissions OnlineMeetingRecording.Read.All)
↓inputVars [steps.InputVariablesStep-1772640079211]: 
  comment: Exposes request inputs in XML for debugging and source mapping.
↓ExecuteListMeetingRecordings [steps.SimpleStep-1772640079242]: 
  comment: Calls Microsoft Graph onlineMeeting recordings endpoint.
  expression: |
    'include("js/graph_meetings.js");
    
    var graphOperation = "list_meeting_recordings";
    var requiredPermission = "OnlineMeetingRecording.Read.All";
    var tokenMode = "delegated_or_application";
    response = null;
    
    try {
    	var targetUser = gm_require("userId", userId);
    	var targetMeetingId = gm_require("onlineMeetingId", onlineMeetingId);
    	var pageTop = gm_parseInteger("top", top, 25);
    	if (pageTop < 1) {
    		pageTop = 1;
    	}
    	if (pageTop > 100) {
    		pageTop = 100;
    	}
    	
    	var tokenInfo = gm_resolveToken(accessToken, tenantId, clientId, clientSecret);
    	tokenMode = tokenInfo.mode;
    	var listed = gm_graphHttp(
    		"GET",
    		tokenInfo.token,
    		"/users/" + gm_urlEncode(targetUser) + "/onlineMeetings/" + gm_urlEncode(targetMeetingId) + "/recordings",
    		{ "$top": String(pageTop) },
    		null,
    		null
    	);
    	
    	var payload = listed.data === null || listed.data === undefined ? {} : listed.data;
    	var values = gm_graphPayloadArray(listed);
    	response = gm_responseOk(graphOperation, tokenMode, requiredPermission, {
    		userId: targetUser,
    		onlineMeetingId: targetMeetingId,
    		count: values.length,
    		nextLink: gm_safeString(payload["@odata.nextLink"]),
    		items: values
    	});
    } catch (e) {
    	response = gm_responseError(graphOperation, tokenMode, requiredPermission, e);
    }'

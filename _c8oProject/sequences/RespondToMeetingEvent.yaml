↓ExecuteRespondToMeetingEvent [steps.SimpleStep-1772553004002]: 
  comment: Calls Microsoft Graph meeting response action endpoint for the target attendee mailbox.
  expression: |
    'include("js/graph_meetings.js");
    
    var graphOperation = "respond_event";
    var requiredPermission = "Calendars.ReadWrite";
    var tokenMode = "delegated_or_application";
    response = null;
    
    try {
    	var targetUser = gm_require("userId", userId);
    	var targetEventId = gm_require("eventId", eventId);
    	var requestedAction = gm_defaultString(responseAction, "accept").toLowerCase();
    	var sendReply = gm_toBoolean(sendResponse, true);
    	
    	var tokenInfo = gm_resolveToken(accessToken, tenantId, clientId, clientSecret);
    	tokenMode = tokenInfo.mode;
    	var graphClient = gm_newGraphClientWithBearer(tokenInfo.token);
    	
    	var eventBuilder = graphClient.users().byUserId(targetUser).events().byEventId(targetEventId);
    	var actionUsed = "";
    	
    	if (requestedAction === "accept") {
    		var acceptBody = gm_newGraphObject("com.microsoft.graph.users.item.events.item.accept.AcceptPostRequestBody");
    		acceptBody.setSendResponse(java.lang.Boolean.valueOf(String(sendReply)));
    		if (!gm_isBlank(comment)) {
    			acceptBody.setComment(String(comment));
    		}
    		eventBuilder.accept().post(acceptBody);
    		actionUsed = "accept";
    	} else if (requestedAction === "decline") {
    		var declineBody = gm_newGraphObject("com.microsoft.graph.users.item.events.item.decline.DeclinePostRequestBody");
    		declineBody.setSendResponse(java.lang.Boolean.valueOf(String(sendReply)));
    		if (!gm_isBlank(comment)) {
    			declineBody.setComment(String(comment));
    		}
    		eventBuilder.decline().post(declineBody);
    		actionUsed = "decline";
    	} else if (requestedAction === "tentativelyaccept" || requestedAction === "tentative") {
    		var tentativeBody = gm_newGraphObject("com.microsoft.graph.users.item.events.item.tentativelyaccept.TentativelyAcceptPostRequestBody");
    		tentativeBody.setSendResponse(java.lang.Boolean.valueOf(String(sendReply)));
    		if (!gm_isBlank(comment)) {
    			tentativeBody.setComment(String(comment));
    		}
    		eventBuilder.tentativelyAccept().post(tentativeBody);
    		actionUsed = "tentativelyAccept";
    	} else {
    		throw new java.lang.IllegalArgumentException("responseAction must be accept, decline or tentativelyAccept");
    	}
    	
    	response = gm_responseOk(graphOperation, tokenMode, requiredPermission, {
    		userId: targetUser,
    		eventId: targetEventId,
    		responseAction: actionUsed,
    		sendResponse: sendReply,
    		comment: gm_safeString(comment)
    	});
    } catch (e) {
    	response = gm_responseError(graphOperation, tokenMode, requiredPermission, e);
    }'

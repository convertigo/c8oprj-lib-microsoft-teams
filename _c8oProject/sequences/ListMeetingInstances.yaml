  comment: Exposes request inputs in XML for debugging and source mapping.
↓ExecuteListMeetingInstances [steps.SimpleStep-1772553003002]: 
  comment: Calls Microsoft Graph instances endpoint and returns normalized event payloads.
  expression: |
    'include("js/graph_meetings.js");
    
    var graphOperation = "list_event_instances";
    var requiredPermission = "Calendars.Read|Calendars.ReadWrite";
    var tokenMode = "delegated_or_application";
    response = null;
    
    try {
    	var organizer = gm_require("organizerUserId", organizerUserId);
    	var seriesMasterEventId = gm_require("eventId", eventId);
    	var windowStart = gm_require("windowStartIso", windowStartIso);
    	var windowEnd = gm_require("windowEndIso", windowEndIso);
    	
    	var pageTop = gm_parseInteger("top", top, 100);
    	if (pageTop < 1) {
    		pageTop = 1;
    	}
    	if (pageTop > 999) {
    		pageTop = 999;
    	}
    	
    	var pageSkip = gm_parseInteger("skip", skip, 0);
    	if (pageSkip < 0) {
    		pageSkip = 0;
    	}
    	
    	var shouldIncludeAttendees = gm_toBoolean(includeAttendees, false);
    	var shouldIncludeBody = gm_toBoolean(includeBody, false);
    	var shouldIncludeCancelled = gm_toBoolean(includeCancelled, true);
    	
    	var tokenInfo = gm_resolveToken(accessToken, tenantId, clientId, clientSecret);
    	tokenMode = tokenInfo.mode;
    	var graphClient = gm_newGraphClientWithBearer(tokenInfo.token);
    	
    	var requestUrl = gm_getGraphBaseUrl(graphClient) + "/users/" + gm_urlEncode(organizer) + "/events/" + gm_urlEncode(seriesMasterEventId) + "/instances";
    	requestUrl = gm_appendQueryParam(requestUrl, "startDateTime", windowStart);
    	requestUrl = gm_appendQueryParam(requestUrl, "endDateTime", windowEnd);
    	requestUrl = gm_appendQueryParam(requestUrl, "$top", String(pageTop));
    	if (pageSkip > 0) {
    		requestUrl = gm_appendQueryParam(requestUrl, "$skip", String(pageSkip));
    	}
    	if (!gm_isBlank(orderBy)) {
    		requestUrl = gm_appendQueryParam(requestUrl, "$orderby", String(orderBy));
    	}
    	
    	var instancesResponse = graphClient.users().byUserId(organizer).events().byEventId(seriesMasterEventId).instances().withUrl(requestUrl).get();
    	var mappedInstances = gm_eventsToArray(instancesResponse.getValue(), shouldIncludeAttendees, shouldIncludeBody);
    	
    	var items = [];
    	var i;
    	for (i = 0; i < mappedInstances.length; i++) {
    		var candidate = mappedInstances[i];
    		if (shouldIncludeCancelled || candidate.isCancelled !== true) {
    			items.push(candidate);
    		}
    	}
    	
    	response = gm_responseOk(graphOperation, tokenMode, requiredPermission, {
    		organizerUserId: organizer,
    		seriesMasterEventId: seriesMasterEventId,
    		count: items.length,
    		nextLink: gm_getOdataNextLink(instancesResponse),
    		query: {
    			windowStartIso: windowStart,
    			windowEndIso: windowEnd,
    			top: pageTop,
    			skip: pageSkip,
    			orderBy: gm_safeString(orderBy),
    			includeAttendees: shouldIncludeAttendees,
    			includeBody: shouldIncludeBody,
    			includeCancelled: shouldIncludeCancelled
    		},
    		items: items
    	});
    } catch (e) {
    	response = gm_responseError(graphOperation, tokenMode, requiredPermission, e);
    }'

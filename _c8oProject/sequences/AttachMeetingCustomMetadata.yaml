accessibility: Hidden
authenticatedContextRequired: true
comment: Attaches custom business metadata to a meeting event via Graph extensions. (Graph permissions Calendars.ReadWrite)
↓inputVars [steps.InputVariablesStep-1772534801524]: 
  comment: Exposes request inputs in XML for debugging and source mapping.
↓ExecuteAttachMetadata [steps.SimpleStep-1772535584397]: 
  comment: Calls Microsoft Graph Java SDK to create or update event open extension data.
  expression: |
    'include("js/graph_meetings.js");
    
    var graphOperation = "patch_event_open_extension";
    var requiredPermission = "Calendars.ReadWrite";
    var tokenMode = "delegated_or_application";
    response = null;
    
    try {
    	var organizer = gm_require("organizerUserId", organizerUserId);
    	var targetEventId = gm_require("eventId", eventId);
    	var targetExtensionId = gm_require("extensionId", extensionId);
    	gm_require("metadataJson", metadataJson);
    	
    	var tokenInfo = gm_resolveToken(accessToken, tenantId, clientId, clientSecret);
    	tokenMode = tokenInfo.mode;
    	var graphClient = gm_newGraphClientWithBearer(tokenInfo.token);
    	
    	var extensionMergeMode = gm_defaultString(mergeMode, "merge");
    	var metadataUpdate = gm_upsertOpenExtension(graphClient, organizer, targetEventId, targetExtensionId, metadataJson, extensionMergeMode);
    	
    	response = gm_responseOk(graphOperation, tokenMode, requiredPermission, {
    		eventId: targetEventId,
    		extensionId: targetExtensionId,
    		mergeMode: extensionMergeMode,
    		metadata: metadataUpdate
    	});
    } catch (e) {
    	response = gm_responseError(graphOperation, tokenMode, requiredPermission, e);
    }'

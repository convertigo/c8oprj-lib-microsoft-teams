↓ExecuteListUserChats [steps.SimpleStep-1772640081714]: 
  comment: Calls Microsoft Graph chats endpoint for the specified user.
  expression: |
    'include("js/graph_meetings.js");
    
    var graphOperation = "list_user_chats";
    var requiredPermission = "Chat.Read|Chat.ReadWrite";
    var tokenMode = "delegated_or_application";
    response = null;
    
    try {
    	var targetUser = gm_require("userId", userId);
    	var pageTop = gm_parseInteger("top", top, 25);
    	if (pageTop < 1) {
    		pageTop = 1;
    	}
    	if (pageTop > 100) {
    		pageTop = 100;
    	}
    	
    	var tokenInfo = gm_resolveToken(accessToken, tenantId, clientId, clientSecret);
    	tokenMode = tokenInfo.mode;
    	var listResult = gm_graphHttp(
    		"GET",
    		tokenInfo.token,
    		"/users/" + gm_urlEncode(targetUser) + "/chats",
    		{ "$top": String(pageTop) },
    		null,
    		null
    	);
    	
    	var payload = listResult.data === null || listResult.data === undefined ? {} : listResult.data;
    	var values = gm_graphPayloadArray(listResult);
    	response = gm_responseOk(graphOperation, tokenMode, requiredPermission, {
    		userId: targetUser,
    		count: values.length,
    		nextLink: gm_safeString(payload["@odata.nextLink"]),
    		items: values
    	});
    } catch (e) {
    	response = gm_responseError(graphOperation, tokenMode, requiredPermission, e);
    }'

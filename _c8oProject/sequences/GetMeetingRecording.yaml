↓ExecuteGetMeetingRecording [steps.SimpleStep-1772640074439]: 
  comment: Calls Microsoft Graph meeting recording endpoint by recording id.
  expression: |
    'include("js/graph_meetings.js");
    
    var graphOperation = "get_meeting_recording";
    var requiredPermission = "OnlineMeetingRecording.Read.All";
    var tokenMode = "delegated_or_application";
    response = null;
    
    try {
    	var targetUser = gm_require("userId", userId);
    	var targetMeetingId = gm_require("onlineMeetingId", onlineMeetingId);
    	var targetRecordingId = gm_require("recordingId", recordingId);
    	
    	var tokenInfo = gm_resolveToken(accessToken, tenantId, clientId, clientSecret);
    	tokenMode = tokenInfo.mode;
    	var fetched = gm_graphHttp(
    		"GET",
    		tokenInfo.token,
    		"/users/" + gm_urlEncode(targetUser) + "/onlineMeetings/" + gm_urlEncode(targetMeetingId) + "/recordings/" + gm_urlEncode(targetRecordingId),
    		null,
    		null,
    		null
    	);
    	
    	response = gm_responseOk(graphOperation, tokenMode, requiredPermission, {
    		userId: targetUser,
    		onlineMeetingId: targetMeetingId,
    		recordingId: targetRecordingId,
    		recording: fetched.data
    	});
    } catch (e) {
    	response = gm_responseError(graphOperation, tokenMode, requiredPermission, e);
    }'

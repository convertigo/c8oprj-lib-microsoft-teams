↓ExecuteUpdateOnlineMeetingSettings [steps.SimpleStep-1772640089653]: 
  comment: Calls Microsoft Graph onlineMeetings PATCH endpoint for mutable meeting settings.
  expression: |
    'include("js/graph_meetings.js");
    
    var graphOperation = "update_online_meeting";
    var requiredPermission = "OnlineMeetings.ReadWrite";
    var tokenMode = "delegated_or_application";
    response = null;
    
    try {
    	var targetUser = gm_require("userId", userId);
    	var targetMeetingId = gm_require("onlineMeetingId", onlineMeetingId);
    	var settingsObject = gm_parseJsonObjectInput("settingsJson", settingsJson, false);
    	if (settingsObject === null || settingsObject === undefined) {
    		throw new java.lang.IllegalArgumentException("settingsJson is required");
    	}
    	
    	var hasPayload = false;
    	var key;
    	for (key in settingsObject) {
    		if (Object.prototype.hasOwnProperty.call(settingsObject, key)) {
    			hasPayload = true;
    			break;
    		}
    	}
    	if (!hasPayload) {
    		throw new java.lang.IllegalArgumentException("settingsJson must contain at least one property");
    	}
    	
    	var tokenInfo = gm_resolveToken(accessToken, tenantId, clientId, clientSecret);
    	tokenMode = tokenInfo.mode;
    	var patched = gm_graphHttp(
    		"PATCH",
    		tokenInfo.token,
    		"/users/" + gm_urlEncode(targetUser) + "/onlineMeetings/" + gm_urlEncode(targetMeetingId),
    		null,
    		settingsObject,
    		null
    	);
    	
    	response = gm_responseOk(graphOperation, tokenMode, requiredPermission, {
    		userId: targetUser,
    		onlineMeetingId: targetMeetingId,
    		updatedOnlineMeeting: patched.data
    	});
    } catch (e) {
    	response = gm_responseError(graphOperation, tokenMode, requiredPermission, e);
    }'

↓ExecuteCreateOnlineMeeting [steps.SimpleStep-1772640068899]: 
  comment: Calls Microsoft Graph onlineMeetings endpoint to create a Teams meeting.
  expression: |
    'include("js/graph_meetings.js");
    
    var graphOperation = "create_online_meeting";
    var requiredPermission = "OnlineMeetings.ReadWrite";
    var tokenMode = "delegated_or_application";
    response = null;
    
    try {
    	var targetUser = gm_require("userId", userId);
    	var subjectValue = gm_require("subject", subject);
    	var startValue = gm_require("startDateTimeIso", startDateTimeIso);
    	var endValue = gm_require("endDateTimeIso", endDateTimeIso);
    	
    	var payload = {
    		subject: subjectValue,
    		startDateTime: startValue,
    		endDateTime: endValue
    	};
    	
    	if (!gm_isBlank(externalId)) {
    		payload.externalId = String(externalId);
    	}
    	
    	if (!gm_isBlank(participantsJson)) {
    		var participants = gm_parseJsonArrayInput("participantsJson", participantsJson, true);
    		var attendees = [];
    		var i;
    		for (i = 0; i < participants.length; i++) {
    			var participant = participants[i];
    			if (!participant) {
    				continue;
    			}
    			var upn = participant.upn || participant.email || participant.userPrincipalName;
    			if (gm_isBlank(upn)) {
    				continue;
    			}
    			var attendee = { upn: String(upn) };
    			if (!gm_isBlank(participant.role)) {
    				attendee.role = String(participant.role);
    			}
    			attendees.push(attendee);
    		}
    		if (attendees.length > 0) {
    			payload.participants = { attendees: attendees };
    		}
    	}
    	
    	var tokenInfo = gm_resolveToken(accessToken, tenantId, clientId, clientSecret);
    	tokenMode = tokenInfo.mode;
    	var targetUserIdForRequest = gm_graphResolveOnlineMeetingsUserId(tokenInfo, targetUser);
    	var created = gm_graphHttp("POST", tokenInfo.token, "/users/" + gm_urlEncode(targetUserIdForRequest) + "/onlineMeetings", null, payload, null);
    	var meeting = created.data === null || created.data === undefined ? {} : created.data;
    	
    	response = gm_responseOk(graphOperation, tokenMode, requiredPermission, {
    		userId: targetUser,
    		resolvedUserId: targetUserIdForRequest,
    		onlineMeetingId: gm_safeString(meeting.id),
    		subject: gm_safeString(meeting.subject),
    		startDateTime: gm_safeString(meeting.startDateTime),
    		endDateTime: gm_safeString(meeting.endDateTime),
    		joinWebUrl: gm_safeString(meeting.joinWebUrl),
    		joinInformation: meeting.joinInformation,
    		raw: meeting
    	});
    } catch (e) {
    	response = gm_responseError(graphOperation, tokenMode, requiredPermission, e);
    }'

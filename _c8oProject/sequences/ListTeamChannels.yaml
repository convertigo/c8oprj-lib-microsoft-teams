↓ExecuteListTeamChannels [steps.SimpleStep-1772640080563]: 
  comment: Calls Microsoft Graph team channels endpoint.
  expression: |
    'include("js/graph_meetings.js");
    
    var graphOperation = "list_team_channels";
    var requiredPermission = "Channel.ReadBasic.All|Channel.Read.All";
    var tokenMode = "delegated_or_application";
    response = null;
    
    try {
    	var targetTeamId = gm_require("teamId", teamId);
    	var pageTop = gm_parseInteger("top", top, 50);
    	if (pageTop < 1) {
    		pageTop = 1;
    	}
    	if (pageTop > 200) {
    		pageTop = 200;
    	}
    	
    	var tokenInfo = gm_resolveToken(accessToken, tenantId, clientId, clientSecret);
    	tokenMode = tokenInfo.mode;
    	var listed = gm_graphHttp(
    		"GET",
    		tokenInfo.token,
    		"/teams/" + gm_urlEncode(targetTeamId) + "/channels",
    		{ "$top": String(pageTop) },
    		null,
    		null
    	);
    	
    	var payload = listed.data === null || listed.data === undefined ? {} : listed.data;
    	var values = gm_graphPayloadArray(listed);
    	response = gm_responseOk(graphOperation, tokenMode, requiredPermission, {
    		teamId: targetTeamId,
    		count: values.length,
    		nextLink: gm_safeString(payload["@odata.nextLink"]),
    		items: values
    	});
    } catch (e) {
    	response = gm_responseError(graphOperation, tokenMode, requiredPermission, e);
    }'

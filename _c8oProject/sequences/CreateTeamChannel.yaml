↓ExecuteCreateTeamChannel [steps.SimpleStep-1772640072584]: 
  comment: Calls Microsoft Graph channels endpoint to create a team channel.
  expression: |
    'include("js/graph_meetings.js");
    
    var graphOperation = "create_team_channel";
    var requiredPermission = "Channel.Create|Channel.ReadWrite.All";
    var tokenMode = "delegated_or_application";
    response = null;
    
    try {
    	var targetTeamId = gm_require("teamId", teamId);
    	var channelName = gm_require("displayName", displayName);
    	var payload = {
    		displayName: channelName,
    		description: gm_safeString(description),
    		membershipType: gm_defaultString(membershipType, "standard")
    	};
    	
    	var tokenInfo = gm_resolveToken(accessToken, tenantId, clientId, clientSecret);
    	tokenMode = tokenInfo.mode;
    	var created = gm_graphHttp("POST", tokenInfo.token, "/teams/" + gm_urlEncode(targetTeamId) + "/channels", null, payload, null);
    	var data = created.data === null || created.data === undefined ? {} : created.data;
    	
    	response = gm_responseOk(graphOperation, tokenMode, requiredPermission, {
    		teamId: targetTeamId,
    		channelId: gm_safeString(data.id),
    		displayName: gm_safeString(data.displayName),
    		membershipType: gm_safeString(data.membershipType),
    		webUrl: gm_safeString(data.webUrl),
    		raw: data
    	});
    } catch (e) {
    	response = gm_responseError(graphOperation, tokenMode, requiredPermission, e);
    }'
